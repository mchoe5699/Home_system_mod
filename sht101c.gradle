plugins { id 'net.minecraftforge.gradle' version '[6.0.16,6.2)' }
version='1.0.56'
group='com.qwerty.homenet'
base { archivesName='sht101c' }
tasks.named('jar') { archiveFileName='sht101c.jar' }
layout.buildDirectory=file('build/sht101c')
java.toolchain.languageVersion=JavaLanguageVersion.of(17)
sourceSets.main.java.setSrcDirs(['src/sht/java'])
sourceSets.main.resources.setSrcDirs(['src/sht/resources'])
sourceSets.test.java.setSrcDirs(['src/shtTest/java'])
sourceSets.test.resources.setSrcDirs(['src/shtTest/resources'])
minecraft {
 mappings channel:'official',version:'1.20.1'
 copyIdeResources=true
 runs {
  configureEach {
   workingDirectory project.file(project.findProperty('sht.runDir') ?: '/tmp/sht101c-new')
   property 'forge.logging.console.level','info'
   mods { homenet_sht101c { source sourceSets.main } }
  }
  client {}
  gameTestServer {
   property 'forge.enabledGameTestNamespaces','homenet_sht101c'
   mods { homenet_sht101c { source sourceSets.test } }
  }
 }
}
// Mirror the release packager's three caption-resource replacements in development runs.
// The pinned baseline archive and all baseline classes remain unchanged.
def captionPaths=['face','gui','gui_open'].collect { "assets/qwertys_homenet/textures/block/kvm931t/${it}.png".toString() }
def baselineRuntime=layout.buildDirectory.file('baseline-runtime.jar')
def prepareBaselineRuntime=tasks.register('prepareBaselineRuntime') {
 inputs.file('.device-baseline/dev.jar')
 inputs.files(captionPaths.collect { file("src/sht/resources/${it}") })
 outputs.file(baselineRuntime)
 doLast {
  def target=baselineRuntime.get().asFile
  target.parentFile.mkdirs()
  new java.util.zip.ZipFile(file('.device-baseline/dev.jar')).withCloseable { original ->
   new java.util.zip.ZipOutputStream(new FileOutputStream(target)).withCloseable { output ->
    original.entries().each { entry ->
     output.putNextEntry(new java.util.zip.ZipEntry(entry.name))
     if(captionPaths.contains(entry.name)) output.write(file("src/sht/resources/${entry.name}").bytes)
     else original.getInputStream(entry).withCloseable { output << it }
     output.closeEntry()
    }
   }
  }
 }
}
def runtimeBaselineFiles=files(baselineRuntime).builtBy(prepareBaselineRuntime)
dependencies {
 minecraft 'net.minecraftforge:forge:1.20.1-47.3.0'
 compileOnly files('.device-baseline/dev.jar')
 runtimeOnly runtimeBaselineFiles
 testImplementation runtimeBaselineFiles
}
tasks.withType(JavaCompile).configureEach { options.encoding='UTF-8' }
tasks.named('jar').configure { finalizedBy 'reobfJar' }
tasks.matching { it.name=='downloadAssets' }.configureEach { enabled=false }
tasks.matching { it.name=='runGameTestServer' }.configureEach { dependsOn tasks.named('testClasses') }
if(project.hasProperty('sht.clientTest')) {
 minecraft.runs.client.property 'sht.clientTest','true'
 minecraft.runs.client.mods.homenet_sht101c.source sourceSets.test
 tasks.matching { it.name=='runClient' }.configureEach { dependsOn tasks.named('testClasses') }
}

tasks.matching { it.name in ['prepareRuns','runClient','runGameTestServer'] }.configureEach { dependsOn prepareBaselineRuntime }

if(project.hasProperty("sht.moveTest")) minecraft.runs.client.property "sht.moveTest","true"
